<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting to Fabrica...</title>
    <script>
      // Single Page App redirect for GitHub Pages
      var pathname = window.location.pathname;
      var pathParts = pathname.split('/').filter(Boolean);
      var repo = pathParts.length > 0 ? '/' + pathParts[0] + '/' : '/';
      window.location.replace(repo + window.location.search + window.location.hash);
    </script>
    <meta http-equiv="refresh" content="0;URL='./'" />
  </head>
  <body style="background-color: #12151e; color: #fff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <p>Redirecting to Fabrica...</p>
  </body>
</html>
